<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" role="img" aria-labelledby="title desc"><title id="title">Logical Drop and physical eviction</title><desc id="desc">A request stops using A before its physical storage is reclaimed. The tree path remains intact.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="8" y="22" font-size="11" fill="#8b7c99" letter-spacing="1">ONE REQUEST</text><text x="188" y="22" font-size="13" fill="#675e70" >Active KV</text><text x="348" y="22" font-size="13" fill="#675e70" >Physical storage</text><text x="8" y="73" font-size="14" fill="#544b5e" >Before Drop</text><g><rect x="188" y="52" width="42" height="34" rx="7" fill="#fff0dc" stroke="#d7a65e" /><text x="209" y="74" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">A</text></g><g><rect x="240" y="52" width="42" height="34" rx="7" fill="#e5eedc" stroke="#91ac72" /><text x="261" y="74" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">B</text><rect x="269" y="76" width="8" height="5" rx="7" fill="#e4ad55" stroke="none" /></g><g><rect x="348" y="52" width="42" height="34" rx="7" fill="#fff0dc" stroke="#d7a65e" /><text x="369" y="74" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">A</text></g><g><rect x="400" y="52" width="42" height="34" rx="7" fill="#e5eedc" stroke="#91ac72" /><text x="421" y="74" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">B</text><rect x="429" y="76" width="8" height="5" rx="7" fill="#e4ad55" stroke="none" /></g><path d="M8 105 L482 105" stroke="#d9d1e3" fill="none" /><text x="8" y="140" font-size="14" fill="#544b5e" >After Drop A</text><g opacity=".28"><rect x="188" y="119" width="42" height="34" rx="7" fill="#fff0dc" stroke="#d7a65e" stroke-dasharray="4 3"/><text x="209" y="141" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">A</text></g><g><rect x="240" y="119" width="42" height="34" rx="7" fill="#e5eedc" stroke="#91ac72" /><text x="261" y="141" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">B</text><rect x="269" y="143" width="8" height="5" rx="7" fill="#e4ad55" stroke="none" /></g><g><rect x="348" y="119" width="42" height="34" rx="7" fill="#fff0dc" stroke="#d7a65e" /><text x="369" y="141" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">A</text></g><g><rect x="400" y="119" width="42" height="34" rx="7" fill="#e5eedc" stroke="#91ac72" /><text x="421" y="141" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">B</text><rect x="429" y="143" width="8" height="5" rx="7" fill="#e4ad55" stroke="none" /></g><path d="M8 172 L482 172" stroke="#d9d1e3" fill="none" /><text x="8" y="207" font-size="14" fill="#544b5e" >After eviction</text><g opacity=".28"><rect x="188" y="186" width="42" height="34" rx="7" fill="#fff0dc" stroke="#d7a65e" stroke-dasharray="4 3"/><text x="209" y="208" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">A</text></g><g><rect x="240" y="186" width="42" height="34" rx="7" fill="#e5eedc" stroke="#91ac72" /><text x="261" y="208" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">B</text><rect x="269" y="210" width="8" height="5" rx="7" fill="#e4ad55" stroke="none" /></g><g><rect x="348" y="186" width="42" height="34" rx="7" fill="#fff" stroke="#d7a65e" stroke-dasharray="4 3"/><text x="369" y="208" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">–</text></g><g><rect x="400" y="186" width="42" height="34" rx="7" fill="#e5eedc" stroke="#91ac72" /><text x="421" y="208" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">B</text><rect x="429" y="210" width="8" height="5" rx="7" fill="#e4ad55" stroke="none" /></g><text x="348" y="168" font-size="11" fill="#8b7c99" >Still needed elsewhere</text><text x="348" y="235" font-size="11" fill="#8b7c99" >A’s storage released</text><path d="M8 252 L482 252" stroke="#d9d1e3" fill="none" /><text x