<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" role="img" aria-labelledby="title desc"><title id="title">Restore historical visibility in one prefill pass</title><desc id="desc">Segment one restores A and B before Drop A. Segment two restores C with B and C visible; A is unavailable. Both are batched within each layer.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><rect x="8" y="8" width="484" height="310" rx="7" fill="#fff" stroke="#e2daec" /><text x="26" y="34" font-size="12" fill="#75549b" font-weight="600" letter-spacing="1">ONE PREFILL PASS</text><text x="189" y="68" font-size="12" fill="#8b7c99" >Query</text><text x="301" y="68" font-size="12" fill="#8b7c99" >Visible keys / values</text><text x="26" y="119" font-size="14" fill="#675277" font-weight="600">Segment 1</text><path d="M156 82 L156 176" stroke="#d9d1e3" fill="none" stroke-width="2"/><g><rect x="187" y="82" width="42" height="34" rx="7" fill="#fff0dc" stroke="#d7a65e" /><text x="208" y="104" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">A</text></g><path d="M241 99 L280 99" stroke="#d9d1e3" fill="none" /><text x="270" y="104" font-size="20" fill="#675e70" >›</text><g><rect x="302" y="82" width="42" height="34" rx="7" fill="#fff0dc" stroke="#d7a65e" /><text x="323" y="104" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">A</text></g><g><rect x="187" y="140" width="42" height="34" rx="7" fill="#e5eedc" stroke="#91ac72" /><text x="208" y="162" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">B</text></g><path d="M241 157 L280 157" stroke="#d9d1e3" fill="none" /><text x="270" y="162" font-size="20" fill="#675e70" >›</text><g><rect x="302" y="140" width="42" height="34" rx="7" fill="#fff0dc" stroke="#d7a65e" /><text x="323" y="162" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">A</text></g><g><rect x="354" y="140" width="42" height="34" rx="7" fill="#e5eedc" stroke="#91ac72" /><text x="375" y="162" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">B</text></g><path d="M26 200 L472 200" stroke="#d9d1e3" fill="none" stroke-dasharray="4 4"/><rect x="26" y="186" width="92" height="28" rx="7" fill="#fbf9fd" stroke="none" /><text x="36" y="205" font-size="13" fill="#8b7c99" >Drop A</text><text x="26" y="245" font-size="14" fill="#675277" font-weight="600">Segment 2</text><path d="M156 220 L156 256" stroke="#d9d1e3" fill="none" stroke-width="2"/><g><rect x="187" y="220" width="42" height="34" rx="7" fill="#e3edfa" stroke="#81a4ce" /><text x="208" y="242" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">C</text></g><path d="M241 237 L280 237" stroke="#d9d1e3" fill="none" /><text x="270" y="242" font-size="20" fill="#675e70" >›</text><g opacity=".28"><rect x="302" y="220" width="42" height="34" rx="7" fill="#fff0dc" stroke="#d7a65e" stroke-dasharray="4 3"/><text x="323" y="242" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">A</text></g><g><rect x="354" y="220" width="42" height="34" rx="7" fill="#e5eedc" stroke="#91ac72" /><text x="375" y="242" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">B</text></g><g><rect x="406" y="220" width="42" height="34" rx="7" fill="#e3edfa" stroke="#81a4ce" /><text x="427" y="242" font-size="15" fill="#544b5e" text-anchor="middle" font-weight="600">C</text></g><text x="250" y="294" font-size="13" fill="#75549b" text-anchor="middle">Segments batched within each layer</text></g></svg>
