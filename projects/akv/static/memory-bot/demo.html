<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AKV memory keeper</title>
  <link rel="stylesheet" href="bot.css">
  <script defer src="scene.js"></script>
  <script defer src="state.js"></script>
  <script defer src="bot.js"></script>
  <style>
    body { margin:0; min-height:100svh; display:grid; place-items:center; background:#1d1d1f; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; }
  </style>
</head>
<body>
  <div class="akv-memory-bot">
    <button id="memory-bot-action" class="akv-memory-action" type="button" aria-label="Run the next memory action" aria-describedby="memory-bot-description" disabled>
      <img id="memory-bot-fallback" src="preview.svg" width="370" height="325" alt="" aria-hidden="true">
      <svg id="memory-bot-scene" xmlns="http://www.w3.org/2000/svg" viewBox="90 110 370 325" aria-hidden="true" hidden><g id="memory-bot-drawing"></g></svg>
    </button>
    <p id="memory-bot-description" class="akv-memory-description">AKV's memory keeper appends cache, drops selected cache while retaining other positions, and repositions the retained cache in a separate action. An illustrative logo animation.</p>
    <p class="akv-memory-caption" id="memory-bot-state">2 active caches</p>
  </div>
</body>
</html>
